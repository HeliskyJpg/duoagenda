<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block titulo %}Registro de Colaboradores{% endblock %}</title>

<!-- Bootstrap CSS por CDN -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- Menú de Navegación -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
      <!-- Cambiado url_for('index') por url_for('inicio') -->
      <a class="navbar-brand fw-bold" href="{{ url_for('inicio') }}">AgendaApp</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <!-- Cambiado url_for('index') por url_for('inicio') -->
            <a class="nav-link" href="{{ url_for('inicio') }}">Inicio</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('registro_colaborador') }}">Registro</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('listado_clientes') }}">Colaboradores</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('listado_resumen') }}">Ver Resumen</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Contenido dinámico -->
  <div class="container">
    {% block contenido %}{% endblock %}
  </div>

<!-- Bootstrap JS por CDN (necesario para el navbar colapsable) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
