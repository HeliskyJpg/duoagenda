{% extends "base.html" %}

{% block titulo %}Resumen{% endblock %}

{% block contenido %}

<h2 class="mb-4">Resumen de Colaboradores por Dia</h2>

<div class="table-responsive">
  <table class="table table-striped table-bordered">
    <thead class="table-dark">
      <tr>
        <th>Dia</th>
        <th>Cantidad de colaboradores</th>
      </tr>
    </thead>
    <tbody>
      {% for dia, cantidad in data.items()%}
      <tr>
        <td>{{ dia }}</td>
        <td>{{ cantidad }}</td>
      </tr>
      {% else %}
      <tr>
        <td colspan="2" class="text-center">Todavia no hay datos para mostrar.</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>

{% endblock %}
