{% extends "base.html" %}

{% block titulo %}Registro de Colaborador{% endblock %}

{% block contenido %}

<div class="row justify-content-center">
  <div class="col-md-8">
    <div class="card shadow-sm">
      <div class="card-body">
        <h2 class="card-title mb-4">Registro de Colaborador</h2>

        <form method="POST" action="{{ url_for('registro_colaborador') }}">

          <div class="mb-3">
            <label for="nombre" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="nombre" name="nombre" required>
          </div>

          <div class="mb-3">
            <label for="apellido" class="form-label">Apellido</label>
            <input type="text" class="form-control" id="apellido" name="apellido" required>
          </div>

          <div class="mb-3">
            <label for="fecha_nacimiento" class="form-label">Fecha de nacimiento</label>
            <input type="date" class="form-control" id="fecha_nacimiento" name="fecha_nacimiento" required>
          </div>

          <div class="mb-3">
            <label for="dia" class="form-label">Dia de la semana que labora</label>
            <select class="form-select" id="dia" name="dia" required>
              <option value="" selected disabled>Selecciona un dia</option>
              <option value="Lunes">Lunes</option>
              <option value="Martes">Martes</option>
              <option value="Miercoles">Miercoles</option>
              <option value="Jueves">Jueves</option>
              <option value="Viernes">Viernes</option>
              <option value="Sabado">Sabado</option>
              <option value="Domingo">Domingo</option>
            </select>
          </div>

          <button type="submit" class="btn btn-primary">Registrar</button>
        </form>

      </div>
    </div>
  </div>
</div>

{% endblock %}
